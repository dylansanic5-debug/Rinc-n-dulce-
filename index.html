<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rincón Dulce | Sorpresa</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #fff8f3, #ffe9df);
  color: #5a372c;
  display: flex;
  justify-content: center;
  overflow-x: hidden;
}

.contenedor {
  width: 100%;
  max-width: 450px;
  padding: 30px 20px;
  text-align: center;
}

/* LOGO */
.logo {
  width: 85px;
  height: 85px;
  margin: 5px auto 15px;
  border-radius: 50%;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 42px;
  box-shadow: 0 8px 25px rgba(100, 50, 30, 0.12);
  border: 3px solid #f0c5b2;
}

h1 {
  font-family: Georgia, serif;
  font-size: 34px;
  margin: 5px 0;
  color: #673d2f;
}

.subtitulo {
  color: #967166;
  font-size: 14px;
  margin-bottom: 25px;
}

/* TARJETA */
.tarjeta {
  background: rgba(255,255,255,0.9);
  border-radius: 28px;
  padding: 28px 20px;
  box-shadow: 0 15px 40px rgba(100,50,30,0.12);
}
