<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rincón Dulce | Sorpresa</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #fff8f3, #ffe9df);
  color: #5a372c;
  display: flex;
  justify-content: center;
  overflow-x: hidden;
}

.contenedor {
  width: 100%;
  max-width: 450px;
  padding: 30px 20px;
  text-align: center;
}

/* LOGO */
.logo {
  width: 85px;
  height: 85px;
  margin: 5px auto 15px;
  border-radius: 50%;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 42px;
  box-shadow: 0 8px 25px rgba(100, 50, 30, 0.12);
  border: 3px solid #f0c5b2;
}

h1 {
  font-family: Georgia, serif;
  font-size: 34px;
  margin: 5px 0;
  color: #673d2f;
}

.subtitulo {
  color: #967166;
  font-size: 14px;
  margin-bottom: 25px;
}

/* TARJETA */
.tarjeta {
  background: rgba(255,255,255,0.9);
  border-radius: 28px;
  padding: 28px 20px;
  box-shadow: 0 15px 40px rgba(100,50,30,0.12);
}</style>
</head>

<body>

<div class="contenedor">

  <div class="logo">🍰</div>

  <h1>Rincón Dulce</h1>

  <p class="subtitulo">
    Un pequeño momento dulce para ti ♡
  </p>

  <div class="tarjeta">
    <img src="logo.jpg" alt="Rincón Dulce" class="logo">

    <div class="etiqueta">
      🎁 QR SORPRESA
    </div>

    <h2>
      ¿Qué te habrá tocado? 👀
    </h2>

    <p class="descripcion">
      Escanea, presiona el botón y descubre tu sorpresa.
      ¡No sabrás qué te toca hasta intentarlo! ✨
    </p>

    <button id="boton">
      🎁 DESCUBRIR MI SORPRESA
    </button>

    <div id="resultado" class="resultado">

      <span id="emoji" class="emoji">🎉</span>

      <h3 id="titulo"></h3>

      <p id="mensaje"></p>

    </div>

    <div class="gracias">
      Gracias por apoyar a Rincón Dulce 💗
    </div>

  </div>

  <div class="footer">
    Hecho con cariño · Rincón Dulce 🍰
  </div>

</div>

<script>

const premios = [

  {
    emoji: "🍫",
    titulo: "¡Te tocó 10% de descuento!",
    mensaje: "Guarda esta sorpresa y úsala en tu próxima compra. 💕"
  },

  {
    emoji: "🧁",
    titulo: "¡Tienes Q5 de descuento!",
    mensaje: "Presenta esta sorpresa en tu próxima compra. ✨"
  },

  {
    emoji: "🎀",
    titulo: "¡Premio sorpresa!",
    mensaje: "Pregunta por tu premio al realizar tu próxima compra. 👀"
  },

  {
    emoji: "💗",
    titulo: "Una frase para ti",
    mensaje: "Los pequeños momentos también merecen celebrarse. 🌷"
  },

  {
    emoji: "✨",
    titulo: "¡Sigue participando!",
    mensaje: "Esta vez te tocó una sorpresa. ¡Puedes volver a intentarlo! 🍰"
  },

  {
    emoji: "🌸",
    titulo: "Una frase para ti",
    mensaje: "Que nunca te falten razones para sonreír y algo dulce para acompañarlas. ♡"
  },

  {
    emoji: "🎉",
    titulo: "¡Tienes 5% de descuento!",
    mensaje: "Presenta esta pantalla en tu próxima compra."
  }

];

const boton = document.getElementById("boton");
const resultado = document.getElementById("resultado");
const emoji = document.getElementById("emoji");
const titulo = document.getElementById("titulo");
const mensaje = document.getElementById("mensaje");

boton.addEventListener("click", function() {

  boton.disabled = true;
  boton.textContent = "✨ DESCUBRIENDO...";

  setTimeout(function() {

    const premio =
      premios[Math.floor(Math.random() * premios.length)];

    emoji.textContent = premio.emoji;
    titulo.textContent = premio.titulo;
    mensaje.textContent = premio.mensaje;

    resultado.classList.add("mostrar");

    
boton.style.display = "none";
  }, 1200);

});

</script>

</body>
</html>
